<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadvidya Result Portal — Student Login</title>
    <meta name="description" content="Login to access your academic performance, semester results and ranking at Sadvidya PU College.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">

        <div class="login-card">

            <h1>Sadvidya PU College</h1>
            <h2>Student Result Portal</h2>
            <p class="portal-description">
                Access your academic performance,
                semester results and ranking securely.
            </p>

            <img src="images/logo.png" alt="Sadvidya Logo" class="logo"
                 onerror="this.style.display='none'">

            <form id="studentLoginForm">

                <label for="roll_no">Roll Number</label>
                <input type="text" id="roll_no" placeholder="Enter your roll number" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>&nbsp; View Result
                </button>

            </form>

            <hr>

            <div style="text-align:center;">
                <a href="admin-login.html" style="color:#9CA3AF; font-size:0.8rem; text-decoration:none;">
                    <i class="fas fa-lock"></i>&nbsp; Admin Access
                </a>
            </div>

        </div>

    </div>

    <script>
        // ── Toast Helper ────────────────────────────
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ── Clear any previous student session ──────
        // (Don't clear admin token — they're separate)

        // ── Student Login ───────────────────────────
        document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const roll_no = document.getElementById('roll_no').value.trim();
            const normalizedRollNo = roll_no.toUpperCase();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!normalizedRollNo || !password) {
                showToast('Please enter both roll number and password', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const res = await fetch('https://collegeresult.onrender.com/api/student/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roll_no: normalizedRollNo, password }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('Login successful! Redirecting...', 'success');
                    localStorage.setItem('student_roll_no', normalizedRollNo);
                    setTimeout(() => {
                        window.location.href = 'result.html';
                    }, 600);
                } else {
                    showToast(data.error || 'Invalid credentials', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i>&nbsp; View Result';
                }
            } catch (err) {
                showToast('Network error — please try again', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i>&nbsp; View Result';
            }
        });
    </script>

</body>
</html>
