<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Sadvidya Result Portal</title>
    <meta name="description" content="Admin login for Sadvidya PU College Result Portal management.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" crossorigin href="./assets/style-stK8hPyc.css">
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">

        <div class="login-card">

            <div style="text-align:center; margin-bottom:24px;">
                <div style="width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#612D53,#7B3F6B); display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px;">
                    <i class="fas fa-shield-halved" style="color:white; font-size:1.8rem;"></i>
                </div>
            </div>

            <h1>Admin Access</h1>
            <h2>Sadvidya PU College Portal</h2>

            <form id="adminLoginForm">

                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required autofocus>

                <button type="submit" id="adminLoginBtn">
                    <i class="fas fa-right-to-bracket"></i>&nbsp; Login
                </button>

            </form>

            <hr>

            <div style="text-align:center;">
                <a href="index.html" style="color:#9CA3AF; font-size:0.85rem; text-decoration:none;">
                    <i class="fas fa-arrow-left"></i>&nbsp; Back to Student Portal
                </a>
            </div>

        </div>

    </div>

    <script>
        // ── Toast Helper ────────────────────────────
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ── If already logged in, redirect ──────────
        const existingToken = localStorage.getItem('admin_token');
        if (existingToken) {
            window.location.href = 'admin.html';
        }

        // ── Admin Login ─────────────────────────────
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('adminPassword').value.trim();
            const btn = document.getElementById('adminLoginBtn');

            if (!password) {
                showToast('Please enter the admin password', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Authenticating...';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('admin_token', data.token);
                    showToast('Admin login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 500);
                } else {
                    showToast(data.error || 'Incorrect password', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-right-to-bracket"></i>&nbsp; Login';
                }
            } catch (err) {
                showToast('Network error — please try again', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-right-to-bracket"></i>&nbsp; Login';
            }
        });
    </script>

</body>
</html>
