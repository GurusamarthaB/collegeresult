<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result — Sadvidya PU College</title>
    <meta name="description" content="View your academic performance report, marks, and rankings at Sadvidya PU College.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" crossorigin href="./assets/style-DsaEYg_8.css">
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="result-wrapper">

        <div class="result-card" id="resultCard">

            <h1>Sadvidya PU College</h1>
            <h2>Academic Performance Report</h2>

            <!-- Student Info -->
            <div class="student-info">

                <div class="info-row">
                    <i class="fas fa-user"></i>
                    <span class="label">Name:</span>
                    <span id="studentName">—</span>
                </div>

                <div class="info-row">
                    <i class="fas fa-id-card"></i>
                    <span class="label">Roll No:</span>
                    <span id="studentRollNo">—</span>
                </div>

                <div class="info-row">
                    <i class="fas fa-graduation-cap"></i>
                    <span class="label">Class:</span>
                    <span id="studentClass">—</span>
                </div>

                <div class="info-row">
                    <i class="fas fa-layer-group"></i>
                    <span class="label">Stream:</span>
                    <span id="studentStream">—</span>
                </div>

                <div class="info-row">
                    <i class="fas fa-book"></i>
                    <span class="label">Combination:</span>
                    <span id="studentCombination">—</span>
                </div>

            </div>

            <hr>

            <!-- Marks Table -->
            <table class="marks-table">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Marks (out of 100)</th>
                    </tr>
                </thead>
                <tbody id="marksBody"></tbody>
            </table>

            <!-- Statistics -->
            <div class="stats">

                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-file-alt"></i>
                    </div>
                    <div>
                        <div class="stat-title">Total Marks</div>
                        <div class="stat-value" id="statTotal">—</div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-percent"></i>
                    </div>
                    <div>
                        <div class="stat-title">Percentage</div>
                        <div class="stat-value" id="statPercent">—</div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-award"></i>
                    </div>
                    <div>
                        <div class="stat-title">Rank</div>
                        <div class="stat-value" id="statRank">—</div>
                    </div>
                </div>

            </div>

            <hr>

            <div class="back-link" style="display:flex; justify-content:center; gap:24px; flex-wrap:wrap;">
                <a href="index.html" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>

        </div>

    </div>

    <script src="js/result.js"></script>

</body>
</html>
